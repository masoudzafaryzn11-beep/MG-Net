name: Build MG APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Initialize Project
        run: |
          flutter create . --org com.mg.vpn --project-name mg --platforms android

      - name: Customize App and UI via Python
        run: |
          python3 -c "
          import os

          # Update AndroidManifest.xml for app name
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('android:label=\"mg\"', 'android:label=\"MG VPN\"')
              content = content.replace('android:label=\"@string/app_name\"', 'android:label=\"MG VPN\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # Write stunning main.dart
          os.makedirs('lib', exist_ok=True)
          code = '''import 'package:flutter/material.dart';
          import 'dart:async';

          void main() {
            runApp(const MGApp());
          }

          class MGApp extends StatelessWidget {
            const MGApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MG VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF030712),
                  primaryColor: const Color(0xFF00E5FF),
                  fontFamily: 'sans-serif',
                ),
                home: const MGHomePage(),
              );
            }
          }

          class MGHomePage extends StatefulWidget {
            const MGHomePage({super.key});

            @override
            State<MGHomePage> createState() => _MGHomePageState();
          }

          class _MGHomePageState extends State<MGHomePage> with SingleTickerProviderStateMixin {
            bool isConnected = false;
            bool isConnecting = false;
            String statusTitle = 'آماده اتصال امن';
            String statusSubtitle = 'تونل VLESS / WS کلادفلر آماده است';
            String currentPing = '-- ms';
            String activeGateway = 'Cloudflare Edge (Direct)';
            bool useGitHubFallback = false;

            late AnimationController _animController;

            @override
            void initState() {
              super.initState();
              _animController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 2),
              )..repeat(reverse: true);
            }

            @override
            void dispose() {
              _animController.dispose();
              super.dispose();
            }

            void _toggleConnection() {
              if (isConnected) {
                setState(() {
                  isConnected = false;
                  isConnecting = false;
                  statusTitle = 'آماده اتصال امن';
                  statusSubtitle = 'تونل قطع شد';
                  currentPing = '-- ms';
                });
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('اتصال با موفقیت قطع شد.')),
                );
              } else {
                setState(() {
                  isConnecting = true;
                  statusTitle = useGitHubFallback ? 'اتصال از طریق گیت‌هاب اضطراری...' : 'اسکن Clean IP و برقراری تونل...';
                  statusSubtitle = 'لطفاً چند لحظه صبر کنید';
                });

                Timer(const Duration(seconds: 3), () {
                  setState(() {
                    isConnecting = false;
                    isConnected = true;
                    statusTitle = useGitHubFallback ? 'متصل (گیت‌هاب پشتیبان 🟢)' : 'متصل و امن (کلادفلر ☁️)';
                    statusSubtitle = 'رمزنگاری VLESS / WebSocket فعال';
                    currentPing = useGitHubFallback ? '45 ms' : '28 ms';
                  });
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('تونل امن MG با موفقیت برقرار شد! ✅', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)), backgroundColor: Color(0xFF00E5FF)),
                  );
                });
              }
            }

            void _showSettings() {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (context) {
                  return StatefulBuilder(
                    builder: (BuildContext context, StateSetter setStateModal) {
                      return Padding(
                        padding: const EdgeInsets.all(24.0),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text('تنظیمات پیشرفته MG', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                                IconButton(icon: const Icon(Icons.close, color: Colors.grey), onPressed: () => Navigator.pop(context)),
                              ],
                            ),
                            const Divider(color: Colors.white24),
                            const SizedBox(height: 10),
                            const Text('انتخاب دروازه اتصال (Gateway):', style: TextStyle(color: Colors.grey, fontSize: 13)),
                            const SizedBox(height: 12),
                            SwitchListTile(
                              title: const Text('فعال‌سازی تانل اضطراری گیت‌هاب', style: TextStyle(color: Colors.white, fontSize: 14)),
                              subtitle: const Text('پشتیبان‌گیری در صورت اختلال کلادفلر', style: TextStyle(color: Colors.grey, fontSize: 11)),
                              value: useGitHubFallback,
                              activeColor: const Color(0xFF00E5FF),
                              onChanged: (val) {
                                setStateModal(() {
                                  useGitHubFallback = val;
                                });
                                setState(() {
                                  useGitHubFallback = val;
                                  activeGateway = val ? 'GitHub Emergency Gateway' : 'Cloudflare Edge (Direct)';
                                });
                              },
                            ),
                            const SizedBox(height: 20),
                            Container(
                              padding: const EdgeInsets.all(14),
                              decoration: BoxDecoration(
                                color: const Color(0xFF1E293B),
                                borderRadius: BorderRadius.circular(14),
                              ),
                              child: Row(
                                children: [
                                  const Icon(Icons.info_outline, color: Color(0xFF00E5FF)),
                                  const SizedBox(width: 12),
                                  Expanded(
                                    child: Text(
                                      useGitHubFallback ? 'حالت اضطراری گیت‌هاب فعال است. ترافیک از مخزن پشتیبان هدایت می‌شود.' : 'حالت عادی فعال است. اتصال مستقیم از طریق VLESS و Cloudflare برقرار می‌شود.',
                                      style: const TextStyle(color: Colors.white70, fontSize: 11),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(height: 20),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(8),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(colors: [Color(0xFF00E5FF), Color(0xFF3B82F6)]),
                          borderRadius: BorderRadius.circular(10),
                        ),
                        child: const Text('MG', style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 14)),
                      ),
                      const SizedBox(width: 12),
                      const Text('MG VPN', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 18)),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings_outlined, color: Color(0xFF00E5FF)),
                      onPressed: _showSettings,
                    ),
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(20.0),
                  child: Column(
                    children: [
                      // Status Header Card
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          gradient: LinearGradient(
                            colors: isConnected 
                                ? [const Color(0xFF064E3B), const Color(0xFF022C22)] 
                                : [const Color(0xFF1E293B), const Color(0xFF0F172A)],
                          ),
                          borderRadius: BorderRadius.circular(20),
                          border: Border.all(
                            color: isConnected ? const Color(0xFF10B981) : const Color(0xFF334155),
                          ),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(statusTitle, style: TextStyle(color: isConnected ? const Color(0xFF34D399) : Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                                const SizedBox(height: 4),
                                Text(statusSubtitle, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                              ],
                            ),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              decoration: BoxDecoration(
                                color: isConnected ? const Color(0xFF059669) : const Color(0xFF334155),
                                borderRadius: BorderRadius.circular(20),
                              ),
                              child: Text(isConnected ? 'فعال' : 'غیرفعال', style: const TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.bold)),
                            ),
                          ],
                        ),
                      ),
                      const Spacer(),

                      // Center Glowing Button
                      Center(
                        child: GestureDetector(
                          onTap: isConnecting ? null : _toggleConnection,
                          child: AnimatedBuilder(
                            animation: _animController,
                            builder: (context, child) {
                              return Container(
                                width: 180,
                                height: 180,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  gradient: RadialGradient(
                                    colors: isConnected
                                        ? [const Color(0xFF00E5FF), const Color(0xFF0F172A)]
                                        : [const Color(0xFF1E293B), const Color(0xFF0F172A)],
                                  ),
                                  boxShadow: [
                                    BoxShadow(
                                      color: (isConnected ? const Color(0xFF00E5FF) : const Color(0xFF3B82F6)).withOpacity(0.3 + (_animController.value * 0.2)),
                                      blurRadius: 30,
                                      spreadRadius: 5 + (_animController.value * 5),
                                    )
                                  ],
                                  border: Border.all(
                                    color: isConnected ? const Color(0xFF00E5FF) : const Color(0xFF3B82F6),
                                    width: 3,
                                  ),
                                ),
                                child: Center(
                                  child: isConnecting
                                      ? const CircularProgressIndicator(color: Color(0xFF00E5FF))
                                      : Column(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            Icon(
                                              isConnected ? Icons.power_settings_new : Icons.lock_outline,
                                              size: 50,
                                              color: isConnected ? Colors.black : const Color(0xFF00E5FF),
                                            ),
                                            const SizedBox(height: 8),
                                            Text(
                                              isConnected ? 'قطع اتصال' : 'اتصال',
                                              style: TextStyle(
                                                fontSize: 16,
                                                fontWeight: FontWeight.bold,
                                                color: isConnected ? Colors.black : Colors.white,
                                              ),
                                            ),
                                          ],
                                        ),
                                ),
                              );
                            },
                          ),
                        ),
                      ),

                      const Spacer(),

                      // Stats Footer Cards
                      Row(
                        children: [
                          Expanded(
                            child: Container(
                              padding: const EdgeInsets.all(16),
                              decoration: BoxDecoration(
                                color: const Color(0xFF0F172A),
                                borderRadius: BorderRadius.circular(16),
                                border: Border.all(color: const Color(0xFF1E293B)),
                              ),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text('پینگ (Latency)', style: TextStyle(color: Colors.grey, fontSize: 11)),
                                  const SizedBox(height: 6),
                                  Text(currentPing, style: const TextStyle(color: Color(0xFF00E5FF), fontSize: 16, fontWeight: FontWeight.bold)),
                                ],
                              ),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Container(
                              padding: const EdgeInsets.all(16),
                              decoration: BoxDecoration(
                                color: const Color(0xFF0F172A),
                                borderRadius: BorderRadius.circular(16),
                                border: Border.all(color: const Color(0xFF1E293B)),
                              ),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text('دروازه اتصال', style: TextStyle(color: Colors.grey, fontSize: 11)),
                                  const SizedBox(height: 6),
                                  Text(activeGateway, style: const TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.bold), maxLines: 1, overflow: TextOverflow.ellipsis),
                                ],
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 20),
                    ],
                  ),
                ),
              );
            }
          }
          '''
          with open('lib/main.dart', 'w', encoding='utf-8') as f:
              f.write(code)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-App
          path: build/app/outputs/flutter-apk/app-release.apk
