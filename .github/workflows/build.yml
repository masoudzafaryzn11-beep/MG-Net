name: Build MG APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Flutter App
        run: flutter create --org com.mg.vpn --project-name mg mg_app

      - name: Inject Pure MG Code
        run: |
          cat << 'EOF' > mg_app/lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MGApp());
          }

          class MGApp extends StatelessWidget {
            const MGApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MG',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF070B12),
                  primaryColor: const Color(0xFF00E5FF),
                ),
                home: const DoctorHomePage(),
              );
            }
          }

          class DoctorHomePage extends StatefulWidget {
            const DoctorHomePage({super.key});

            @override
            State<DoctorHomePage> createState() => _DoctorHomePageState();
          }

          class _DoctorHomePageState extends State<DoctorHomePage> {
            bool isRunning = false;
            String statusText = 'آماده برقراری تونل امن...';
            int currentStep = 0;
            String appVersion = 'v1.7.0';
            
            String customWorkerUrl = 'https://mg-net.workers.dev';
            String githubTunnelUrl = 'https://raw.githubusercontent.com/mlmvpn/mlmvpn-gateway/main/configs/fallback.json';
            bool isGitHubTunnelActive = false;
            String connectionLatency = 'تنظیم نشده';
            String activeProtocol = 'VLESS / WS Cloudflare';

            final TextEditingController _workerInputController = TextEditingController();
            final TextEditingController _githubTunnelController = TextEditingController();

            final List<Map<String, String>> steps = [
              {'title': 'اتصال حساب / تانل', 'desc': 'بررسی هویت کلادفلر و گیت‌وی', 'status': 'در انتظار'},
              {'title': 'Deploy / Gateway Fetch', 'desc': 'دریافت اسکریپت mlmvpn-gateway', 'status': 'در انتظار'},
              {'title': 'دریافت کانفیگ VLESS', 'desc': 'استخراج پارامترهای WS و TLS', 'status': 'در انتظار'},
              {'title': 'Scan Clean IP', 'desc': 'پیدا کردن سالم‌ترین آی‌پی کلادفلر', 'status': 'در انتظار'},
              {'title': 'اتصال و تست پینگ', 'desc': 'برقرارسازی تونل نهایی MG', 'status': 'در انتظار'},
            ];

            @override
            void initState() {
              super.initState();
              _workerInputController.text = customWorkerUrl;
              _githubTunnelController.text = githubTunnelUrl;
            }

            void _showCloudflareSettingsDialog() {
              showDialog(
                context: context,
                builder: (BuildContext context) {
                  return AlertDialog(
                    backgroundColor: const Color(0xFF111827),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                    title: Row(
                      children: const [
                        Icon(Icons.cloud, color: Color(0xFFF38020)),
                        SizedBox(width: 10),
                        Text('تنظیمات ورکر کلادفلر', style: TextStyle(color: Colors.white, fontSize: 15)),
                      ],
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text('آدرس Worker اختصاصی خود را وارد کنید:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                        const SizedBox(height: 10),
                        TextField(
                          controller: _workerInputController,
                          style: const TextStyle(color: Color(0xFF00E5FF), fontSize: 13),
                          decoration: InputDecoration(
                            filled: true,
                            fillColor: const Color(0xFF070B12),
                            border: OutlineInputBorder(
                              borderRadius: BorderRadius.circular(12),
                              borderSide: BorderSide.none,
                            ),
                          ),
                        ),
                      ],
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.of(context).pop(),
                        child: const Text('انصراف', style: TextStyle(color: Colors.grey)),
                      ),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00E5FF)),
                        onPressed: () {
                          setState(() {
                            customWorkerUrl = _workerInputController.text;
                          });
                          Navigator.of(context).pop();
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('آدرس ورکر کلادفلر ذخیره شد!')),
                          );
                        },
                        child: const Text('ذخیره', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                      ),
                    ],
                  );
                },
              );
            }

            void _showGitHubTunnelDialog() {
              showDialog(
                context: context,
                builder: (BuildContext context) {
                  return AlertDialog(
                    backgroundColor: const Color(0xFF111827),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                    title: Row(
                      children: const [
                        Icon(Icons.hub, color: Color(0xFF2979FF)),
                        SizedBox(width: 10),
                        Text('گیت‌هاب تانل اضطراری', style: TextStyle(color: Colors.white, fontSize: 15)),
                      ],
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text('در صورت اختلال کلادفلر، لینک گیت‌وی اضطراری استفاده می‌شود:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                        const SizedBox(height: 10),
                        TextField(
                          controller: _githubTunnelController,
                          style: const TextStyle(color: Color(0xFF00E5FF), fontSize: 11),
                          decoration: InputDecoration(
                            filled: true,
                            fillColor: const Color(0xFF070B12),
                            border: OutlineInputBorder(
                              borderRadius: BorderRadius.circular(12),
                              borderSide: BorderSide.none,
                            ),
                          ),
                        ),
                        const SizedBox(height: 15),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('فعال‌سازی تانل اضطراری:', style: TextStyle(color: Colors.white, fontSize: 13)),
                            Switch(
                              value: isGitHubTunnelActive,
                              activeColor: const Color(0xFF00E5FF),
                              onChanged: (val) {
                                setState(() {
                                  isGitHubTunnelActive = val;
                                  activeProtocol = val ? 'GitHub Emergency Gateway' : 'VLESS / WS Cloudflare';
                                });
                              },
                            ),
                          ],
                        ),
                      ],
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.of(context).pop(),
                        child: const Text('بستن', style: TextStyle(color: Colors.grey)),
                      ),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2979FF)),
                        onPressed: () {
                          setState(() {
                            githubTunnelUrl = _githubTunnelController.text;
                          });
                          Navigator.of(context).pop();
                          ScaffoldMessenger.of(context).showSnackBar(
                            SnackBar(content: Text(isGitHubTunnelActive ? 'گیت‌هاب تانل اضطراری فعال شد!' : 'تنظیمات تانل ذخیره شد.')),
                          );
                        },
                        child: const Text('تایید', style: TextStyle(color: Colors.white)),
                      ),
                    ],
                  );
                },
              );
            }

            void _checkForUpdates() {
              showDialog(
                context: context,
                builder: (BuildContext context) {
                  return AlertDialog(
                    backgroundColor: const Color(0xFF111827),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                    title: Row(
                      children: const [
                        Icon(Icons.system_update, color: Color(0xFF00E5FF)),
                        SizedBox(width: 10),
                        Text('بررسی به‌روزرسانی', style: TextStyle(color: Colors.white, fontSize: 16)),
                      ],
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('نسخه فعلی: $appVersion', style: const TextStyle(color: Colors.grey, fontSize: 12)),
                        const SizedBox(height: 10),
                        const Text('شما از آخرین نسخه MG استفاده می‌کنید!', style: TextStyle(color: Colors.greenAccent, fontSize: 13, fontWeight: FontWeight.bold)),
                      ],
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.of(context).pop(),
                        child: const Text('بستن', style: TextStyle(color: Color(0xFF00E5FF))),
                      ),
                    ],
                  );
                },
              );
            }

            void _startProcess() {
              setState(() {
                isRunning = true;
                statusText = isGitHubTunnelActive ? 'دریافت کدهای mlmvpn-gateway از گیت‌هاب...' : 'اتصال به ورکر ($customWorkerUrl)...';
                currentStep = 0;
                steps[0]['status'] = 'در حال اجرا...';
              });

              Future.delayed(const Duration(seconds: 2), () {
                setState(() {
                  steps[0]['status'] = 'تکمیل شد';
                  steps[1]['status'] = 'در حال اجرا...';
                  currentStep = 1;
                  statusText = isGitHubTunnelActive ? 'بارگذاری کانفیگ پشتیبان گیت‌هاب...' : 'پردازش اسکریپت VLESS Gateway...';
                });
              });

              Future.delayed(const Duration(seconds: 4), () {
                setState(() {
                  steps[1]['status'] = 'تکمیل شد';
                  steps[2]['status'] = 'در حال اجرا...';
                  currentStep = 2;
                  statusText = 'تنظیم پارامترهای VLESS / WS Tunnel...';
                });
              });

              Future.delayed(const Duration(seconds: 6), () {
                setState(() {
                  steps[2]['status'] = 'تکمیل شد';
                  steps[3]['status'] = 'در حال اجرا...';
                  currentStep = 3;
                  statusText = 'اسکن و تست سالم‌ترین IP کلادفلر...';
                });
              });

              Future.delayed(const Duration(seconds: 8), () {
                setState(() {
                  steps[3]['status'] = 'تکمیل شد';
                  steps[4]['status'] = 'متصل شد ✅';
                  currentStep = 4;
                  isRunning = false;
                  connectionLatency = '38 ms (فوق‌العاده)';
                  statusText = isGitHubTunnelActive ? 'گیت‌هاب تانل اضطراری متصل شد!' : 'تونل VLESS کلادفلر با موفقیت برقرار شد!';
                });
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Row(
                        children: [
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                            decoration: BoxDecoration(
                              gradient: const LinearGradient(
                                colors: [Color(0xFF00E5FF), Color(0xFF2979FF)],
                              ),
                              borderRadius: BorderRadius.circular(10),
                              boxShadow: [
                                BoxShadow(
                                  color: const Color(0xFF00E5FF).withOpacity(0.5),
                                  blurRadius: 10,
                                  spreadRadius: 1,
                                )
                              ],
                            ),
                            child: const Text(
                              'MG',
                              style: TextStyle(
                                fontWeight: FontWeight.black,
                                fontSize: 16,
                                color: Colors.black,
                                letterSpacing: 1.5,
                              ),
                            ),
                          ),
                          const SizedBox(width: 8),
                          IconButton(
                            icon: const Icon(Icons.cloud_circle, color: Color(0xFFF38020), size: 26),
                            onPressed: _showCloudflareSettingsDialog,
                            tooltip: 'تنظیمات ورکر',
                          ),
                          IconButton(
                            icon: Icon(Icons.hub, color: isGitHubTunnelActive ? Colors.greenAccent : Colors.blueAccent, size: 24),
                            onPressed: _showGitHubTunnelDialog,
                            tooltip: 'گیت‌هاب تانل اضطراری',
                          ),
                        ],
                      ),
                      IconButton(
                        icon: const Icon(Icons.update, color: Color(0xFF00E5FF)),
                        onPressed: _checkForUpdates,
                        tooltip: 'بررسی به‌روزرسانی',
                      ),
                    ],
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                            decoration: BoxDecoration(
                              color: isGitHubTunnelActive ? Colors.green.withOpacity(0.2) : Colors.blue.withOpacity(0.1),
                              borderRadius: BorderRadius.circular(6),
                            ),
                            child: Text(
                              isGitHubTunnelActive ? 'حالت: گیت‌هاب تانل اضطراری 🟢' : 'حالت: ورکر کلادفلر ☁️',
                              style: TextStyle(color: isGitHubTunnelActive ? Colors.greenAccent : const Color(0xFF00E5FF), fontSize: 11, fontWeight: FontWeight.bold),
                            ),
                          ),
                          const Text(
                            'MG',
                            style: TextStyle(color: Colors.white54, fontSize: 12, fontWeight: FontWeight.bold),
                          ),
                        ],
                      ),
                      const SizedBox(height: 14),

                      Container(
                        padding: const EdgeInsets.all(22),
                        decoration: BoxDecoration(
                          color: const Color(0xFF111827),
                          borderRadius: BorderRadius.circular(24),
                          border: Border.all(
                            color: isRunning ? const Color(0xFF00E5FF) : Colors.white12,
                          ),
                          boxShadow: [
                            if (isRunning)
                              BoxShadow(
                                color: const Color(0xFF00E5FF).withOpacity(0.25),
                                blurRadius: 20,
                                spreadRadius: 2,
                              )
                          ],
                        ),
                        child: Column(
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                const Icon(Icons.speed, size: 16, color: Colors.grey),
                                const SizedBox(width: 6),
                                Text('پینگ: $connectionLatency', style: const TextStyle(color: Colors.grey, fontSize: 12)),
                                const SizedBox(width: 15),
                                const Icon(Icons.security, size: 16, color: Colors.grey),
                                const SizedBox(width: 6),
                                Text(activeProtocol, style: const TextStyle(color: Colors.grey, fontSize: 11)),
                              ],
                            ),
                            const SizedBox(height: 16),
                            Container(
                              width: 80,
                              height: 80,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: RadialGradient(
                                  colors: isRunning
                                      ? [const Color(0xFF00E5FF), const Color(0xFF111827)]
                                      : [const Color(0xFF1F293D), const Color(0xFF111827)],
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: (isRunning ? const Color(0xFF00E5FF) : const Color(0xFF2979FF)).withOpacity(0.4),
                                    blurRadius: 20,
                                    spreadRadius: 2,
                                  )
                                ],
                              ),
                              child: Center(
                                child: Text(
                                  'MG',
                                  style: TextStyle(
                                    fontSize: 28,
                                    fontWeight: FontWeight.black,
                                    color: isRunning ? Colors.black : const Color(0xFF00E5FF),
                                    letterSpacing: 2,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 18),
                            Text(
                              statusText,
                              style: const TextStyle(
                                fontSize: 14,
                                fontWeight: FontWeight.bold,
                                color: Colors.white,
                              ),
                              textAlign: TextAlign.center,
                            ),
                            const SizedBox(height: 22),
                            SizedBox(
                              width: double.infinity,
                              height: 50,
                              child: ElevatedButton(
                                onPressed: isRunning ? null : _startProcess,
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFF00E5FF),
                                  shape: RoundedRectangleBorder(
                                    borderRadius: BorderRadius.circular(14),
                                  ),
                                ),
                                child: Text(
                                  isGitHubTunnelActive ? 'اتصال از طریق گیت‌هاب تانل اضطراری' : 'ورود به Cloud و شروع',
                                  style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.black),
                                ),
                              ),
                            ),
                            const SizedBox(height: 12),
                            SizedBox(
                              width: double.infinity,
                              height: 50,
                              child: OutlinedButton(
                                onPressed: () {
                                  setState(() {
                                    isRunning = false;
                                    statusText = 'بررسی متوقف شد.';
                                    connectionLatency = 'تنظیم نشده';
                                    for (var s in steps) {
                                      s['status'] = 'در انتظار';
                                    }
                                  });
                                },
                                style: OutlinedButton.styleFrom(
                                  side: const BorderSide(color: Colors.white24),
                                  shape: RoundedRectangleBorder(
                                    borderRadius: BorderRadius.circular(14),
                                  ),
                                ),
                                child: const Text(
                                  'تلاش دوباره / ریست',
                                  style: TextStyle(fontSize: 14, color: Colors.white70, fontWeight: FontWeight.bold),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 24),

                      const Padding(
                        padding: EdgeInsets.symmetric(horizontal: 4.0),
                        child: Text(
                          'مراحل اجرای ابری',
                          style: TextStyle(color: Colors.white70, fontSize: 14, fontWeight: FontWeight.bold),
                        ),
                      ),
                      const SizedBox(height: 10),

                      ListView.builder(
                        shrinkWrap: true,
                        physics: const NeverScrollableScrollPhysics(),
                        itemCount: steps.length,
                        itemBuilder: (context, index) {
                          final step = steps[index];
                          bool isCompleted = step['status'] == 'تکمیل شد' || step['status'] == 'متصل شد ✅';
                          bool isRunningStep = step['status'] == 'در حال اجرا...';

                          IconData stepIcon;
                          if (index == 0) stepIcon = Icons.person;
                          else if (index == 1) stepIcon = isGitHubTunnelActive ? Icons.hub : Icons.cloud_upload;
                          else if (index == 2) stepIcon = Icons.cloud_download;
                          else if (index == 3) stepIcon = Icons.qr_code_scanner;
                          else stepIcon = Icons.swap_vert;

                          return Container(
                            margin: const EdgeInsets.only(bottom: 10),
                            padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(
                              color: const Color(0xFF111827),
                              borderRadius: BorderRadius.circular(14),
                              border: Border.all(
                                color: isRunningStep ? const Color(0xFF00E5FF).withOpacity(0.6) : Colors.white10,
                              ),
                            ),
                            child: Row(
                              children: [
                                Container(
                                  padding: const EdgeInsets.all(8),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF00E5FF).withOpacity(0.15),
                                    borderRadius: BorderRadius.circular(10),
                                  ),
                                  child: Icon(stepIcon, color: const Color(0xFF00E5FF), size: 18),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        step['title']!,
                                        style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white),
                                      ),
                                      const SizedBox(height: 2),
                                      Text(
                                        step['desc']!,
                                        style: const TextStyle(fontSize: 10, color: Colors.grey),
                                      ),
                                    ],
                                  ),
                                ),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 5),
                                  decoration: BoxDecoration(
                                    color: isCompleted
                                        ? Colors.green.withOpacity(0.2)
                                        : (isRunningStep ? const Color(0xFF00E5FF).withOpacity(0.2) : Colors.white.withOpacity(0.05)),
                                    borderRadius: BorderRadius.circular(6),
                                  ),
                                  child: Text(
                                    step['status']!,
                                    style: TextStyle(
                                      fontSize: 10,
                                      fontWeight: FontWeight.bold,
                                      color: isCompleted
                                          ? Colors.greenAccent
                                          : (isRunningStep ? const Color(0xFF00E5FF) : Colors.grey),
                                    ),
                                  ),
                                ),
                              ],
                            ),
                          );
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: |
          cd mg_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: MG-App
          path: mg_app/build/app/outputs/flutter-apk/app-release.apk
