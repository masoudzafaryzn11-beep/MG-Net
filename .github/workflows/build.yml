name: Build MG Net Professional APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Flutter App
        run: flutter create --org com.mgnet.vpn --project-name mg_net mg_net_app

      - name: Inject Professional Neon VPN UI Code
        run: |
          cat << 'EOF' > mg_net_app/lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MGNetApp());
          }

          class MGNetApp extends StatelessWidget {
            const MGNetApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MG Net VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0B0F19),
                  primaryColor: const Color(0xFF00E5FF),
                ),
                home: const VPNHomePage(),
              );
            }
          }

          class VPNHomePage extends StatefulWidget {
            const VPNHomePage({super.key});

            @override
            State<VPNHomePage> createState() => _VPNHomePageState();
          }

          class _VPNHomePageState extends State<VPNHomePage> {
            bool isConnected = false;
            bool isConnecting = false;
            String connectionStatus = 'قطع شده';
            String selectedServer = 'سرور فوق‌العاده اختصاصی (آلمان - پرسرعت)';
            final TextEditingController _configController = TextEditingController(
              text: 'vless://mg-net-secure-uuid@server.mgnet.com:443?encryption=none&security=tls#MG-Net-VIP',
            );

            void _toggleConnection() {
              setState(() {
                if (isConnected) {
                  isConnected = false;
                  connectionStatus = 'قطع شده';
                } else {
                  isConnecting = true;
                  connectionStatus = 'در حال اتصال به سرور...';
                  
                  Future.delayed(const Duration(seconds: 2), () {
                    setState(() {
                      isConnecting = false;
                      isConnected = true;
                      connectionStatus = 'متصل و امن';
                    });
                  });
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF131B2E),
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(6),
                        decoration: BoxDecoration(
                          color: const Color(0xFF00E5FF).withOpacity(0.2),
                          borderRadius: BorderRadius.circular(8),
                        ),
                        child: const Icon(Icons.bolt, color: Color(0xFF00E5FF), size: 24),
                      ),
                      const SizedBox(width: 12),
                      const Text(
                        'MG Net',
                        style: TextStyle(
                          fontWeight: FontWeight.bold,
                          letterSpacing: 1.2,
                          color: Colors.white,
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings, color: Colors.white70),
                      onPressed: () {
                        ScaffoldMessenger.of(context).showSnackBar(
                          const SnackBar(content: Text('تنظیمات پیشرفته امنیتی MG Net')),
                        );
                      },
                    ),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.center,
                    children: [
                      // Status Card
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: const Color(0xFF131B2E),
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(
                            color: isConnected 
                                ? const Color(0xFF00E676).withOpacity(0.5) 
                                : const Color(0xFF00E5FF).withOpacity(0.2),
                          ),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('وضعیت تونل امن', style: TextStyle(color: Colors.grey, fontSize: 12)),
                                const SizedBox(height: 4),
                                Text(
                                  connectionStatus,
                                  style: TextStyle(
                                    color: isConnected ? const Color(0xFF00E676) : const Color(0xFF00E5FF),
                                    fontWeight: FontWeight.bold,
                                    fontSize: 16,
                                  ),
                                ),
                              ],
                            ),
                            Container(
                              width: 12,
                              height: 12,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                color: isConnected ? const Color(0xFF00E676) : Colors.redAccent,
                                boxShadow: [
                                  BoxShadow(
                                    color: (isConnected ? const Color(0xFF00E676) : Colors.redAccent).withOpacity(0.6),
                                    blurRadius: 8,
                                    spreadRadius: 2,
                                  )
                                ],
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 30),

                      // Big Connect Button with Neon Glow
                      GestureDetector(
                        onTap: isConnecting ? null : _toggleConnection,
                        child: Container(
                          width: 180,
                          height: 180,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            gradient: LinearGradient(
                              colors: isConnected
                                  ? [const Color(0xFF00E676), const Color(0xFF00C853)]
                                  : [const Color(0xFF00E5FF), const Color(0xFF2979FF)],
                              begin: Alignment.topLeft,
                              end: Alignment.bottomRight,
                            ),
                            boxShadow: [
                              BoxShadow(
                                color: (isConnected ? const Color(0xFF00E676) : const Color(0xFF00E5FF)).withOpacity(0.5),
                                blurRadius: 30,
                                spreadRadius: 5,
                              ),
                            ],
                          ),
                          child: Center(
                            child: isConnecting
                                ? const CircularProgressIndicator(color: Colors.white)
                                : Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Icon(
                                        isConnected ? Icons.lock : Icons.power_settings_new,
                                        size: 64,
                                        color: Colors.white,
                                      ),
                                      const SizedBox(height: 8),
                                      Text(
                                        isConnected ? 'قطع اتصال' : 'اتصال امن',
                                        style: const TextStyle(
                                          color: Colors.white,
                                          fontWeight: FontWeight.bold,
                                          fontSize: 16,
                                        ),
                                      ),
                                    ],
                                  ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 40),

                      // Server Selector Card
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: const Color(0xFF131B2E),
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('سرور انتخابی اختصاصی', style: TextStyle(color: Colors.grey, fontSize: 12)),
                            const SizedBox(height: 8),
                            Row(
                              children: [
                                const Icon(Icons.dns, color: Color(0xFF00E5FF), size: 20),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Text(
                                    selectedServer,
                                    style: const TextStyle(color: Colors.white, fontWeight: FontWeight.w600),
                                  ),
                                ),
                                const Icon(Icons.arrow_forward_ios, color: Colors.grey, size: 16),
                              ],
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),

                      // Config Link Box
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: const Color(0xFF131B2E),
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('لینک کانفیگ اختصاصی (VLESS / Xray)', style: TextStyle(color: Colors.grey, fontSize: 12)),
                            const SizedBox(height: 8),
                            TextField(
                              controller: _configController,
                              style: const TextStyle(color: Color(0xFF00E5FF), fontSize: 12),
                              decoration: InputDecoration(
                                filled: true,
                                fillColor: const Color(0xFF0B0F19),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(12),
                                  borderSide: BorderSide.none,
                                ),
                                suffixIcon: IconButton(
                                  icon: const Icon(Icons.check, color: Color(0xFF00E676)),
                                  onPressed: () {
                                    ScaffoldMessenger.of(context).showSnackBar(
                                      const SnackBar(content: Text('کانفیگ اختصاصی ذخیره و اعمال شد!')),
                                    );
                                  },
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: |
          cd mg_net_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-Net-v2-Pro
          path: mg_net_app/build/app/outputs/flutter-apk/app-release.apk
