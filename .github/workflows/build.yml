name: Build MG Net APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter create mg_net_app
      - name: Build APK
        run: |
          cd mg_net_app
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: MG-Net-v1.apk
          path: mg_net_app/build/app/outputs/flutter-apk/app-release.apk
