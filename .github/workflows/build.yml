name: Build MG APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Initialize Project
        run: |
          flutter create . --org com.mg.vpn --project-name mg --platforms android

      - name: Inject MLM VPN Style Code via Python
        run: |
          python3 -c "
          import os

          # Update AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('android:label=\"mg\"', 'android:label=\"MG VPN\"')
              content = content.replace('android:label=\"@string/app_name\"', 'android:label=\"MG VPN\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # Write main.dart
          os.makedirs('lib', exist_ok=True)
          code = '''import 'package:flutter/material.dart';
          import 'dart:async';

          void main() {
            runApp(const MGApp());
          }

          class MGApp extends StatelessWidget {
            const MGApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MG VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF070B14),
                  primaryColor: const Color(0xFF00E5FF),
                ),
                home: const MGHomePage(),
              );
            }
          }

          class MGHomePage extends StatefulWidget {
            const MGHomePage({super.key});

            @override
            State<MGHomePage> createState() => _MGHomePageState();
          }

          class _MGHomePageState extends State<MGHomePage> {
            bool isConnected = false;
            bool isConnecting = false;
            String pingText = '-- ms';
            String networkText = 'Cloudflare Edge';

            void _toggleConnection() {
              if (isConnected) {
                setState(() {
                  isConnected = false;
                  isConnecting = false;
                  pingText = '-- ms';
                });
              } else {
                setState(() {
                  isConnecting = true;
                });
                Timer(const Duration(seconds: 2), () {
                  setState(() {
                    isConnecting = false;
                    isConnected = true;
                    pingText = '28 ms';
                  });
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(colors: [Color(0xFF00E5FF), Color(0xFF2979FF)]),
                          borderRadius: BorderRadius.circular(8),
                        ),
                        child: const Text('MG', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 14)),
                      ),
                      const SizedBox(width: 10),
                      const Text('MG VPN', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 18)),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings, color: Color(0xFF00E5FF)),
                      onPressed: () {},
                    )
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 20.0, vertical: 10.0),
                  child: Column(
                    children: [
                      const SizedBox(height: 10),
                      // Main Shield Card
                      Expanded(
                        child: Container(
                          width: double.infinity,
                          decoration: BoxDecoration(
                            color: const Color(0xFF0F172A),
                            borderRadius: BorderRadius.circular(24),
                            border: Border.all(color: Colors.white10),
                          ),
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              // Shield Icon Stack
                              Container(
                                width: 130,
                                height: 150,
                                decoration: const BoxDecoration(
                                  image: DecorationImage(
                                    image: NetworkImage('https://raw.githubusercontent.com/cloudflare/cloudflare-docs/main/static/favicon.ico'),
                                    fit: BoxFit.contain,
                                  ),
                                ),
                                child: Icon(
                                  Icons.shield,
                                  size: 130,
                                  color: isConnected ? const Color(0xFF00E5FF) : const Color(0xFF2979FF),
                                ),
                              ),
                              const SizedBox(height: 20),
                              const Text(
                                'CLOUDFLARE',
                                style: TextStyle(color: Colors.white70, fontSize: 16, fontWeight: FontWeight.bold, letterSpacing: 2),
                              ),
                              const SizedBox(height: 6),
                              const Text(
                                'WARP',
                                style: TextStyle(color: Colors.white, fontSize: 32, fontWeight: FontWeight.black, letterSpacing: 3),
                              ),
                              const SizedBox(height: 12),
                              Text(
                                isConnected ? 'متصل' : 'قطع اتصال',
                                style: TextStyle(
                                  color: isConnected ? Colors.greenAccent : Colors.white60,
                                  fontSize: 22,
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                              const SizedBox(height: 6),
                              Text(
                                isConnected ? 'ترافیک شما امن است' : 'آماده برقراری اتصال',
                                style: const TextStyle(color: Colors.grey, fontSize: 13),
                              ),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 20),

                      // Ping and Network Status Text
                      Text(
                        'شبکه: $networkText  |  پینگ: $pingText',
                        style: const TextStyle(color: Colors.grey, fontSize: 13, fontWeight: FontWeight.w500),
                      ),
                      const SizedBox(height: 12),

                      // Bottom Neon Action Button
                      SizedBox(
                        width: double.infinity,
                        height: 56,
                        child: ElevatedButton(
                          onPressed: isConnecting ? null : _toggleConnection,
                          style: ElevatedButton.styleFrom(
                            backgroundColor: isConnected ? const Color(0xFF0088FF) : const Color(0xFF00E5FF),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(16),
                            ),
                            elevation: 8,
                            shadowColor: const Color(0xFF00E5FF).withOpacity(0.5),
                          ),
                          child: isConnecting
                              ? const CircularProgressIndicator(color: Colors.black)
                              : Row(
                                  mainAxisAlignment: MainAxisAlignment.center,
                                  children: [
                                    const Icon(Icons.power_settings_new, color: Colors.black, size: 24),
                                    const SizedBox(width: 8),
                                    Text(
                                      isConnected ? 'قطع اتصال' : 'اتصال سریع',
                                      style: const TextStyle(color: Colors.black, fontSize: 16, fontWeight: FontWeight.bold),
                                    ),
                                  ],
                                ),
                        ),
                      ),
                      const SizedBox(height: 10),
                    ],
                  ),
                ),
              );
            }
          }
          '''
          with open('lib/main.dart', 'w', encoding='utf-8') as f:
              f.write(code)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-App
          path: build/app/outputs/flutter-apk/app-release.apk
