name: Build MG Net Cloudflare Edition APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Flutter App
        run: flutter create --org com.mgnet.vpn --project-name mg_net mg_net_app

      - name: Inject Cloudflare Integrated VPN UI
        run: |
          cat << 'EOF' > mg_net_app/lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MGNetApp());
          }

          class MGNetApp extends StatelessWidget {
            const MGNetApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MG Net VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF090D16),
                  primaryColor: const Color(0xFFF38020), // Cloudflare Orange Accent
                ),
                home: const VPNHomePage(),
              );
            }
          }

          class VPNHomePage extends StatefulWidget {
            const VPNHomePage({super.key});

            @override
            State<VPNHomePage> createState() => _VPNHomePageState();
          }

          class _VPNHomePageState extends State<VPNHomePage> {
            bool isConnected = false;
            bool isConnecting = false;
            String connectionStatus = 'غیرفعال';
            String selectedServer = 'Cloudflare Worker (Clean IP - Fast)';
            int ping = 45;
            
            final TextEditingController _workerController = TextEditingController(
              text: 'https://mg-net.workers.dev/vless',
            );

            void _toggleConnection() {
              setState(() {
                if (isConnected) {
                  isConnected = false;
                  connectionStatus = 'قطع شد';
                } else {
                  isConnecting = true;
                  connectionStatus = 'در حال اسکن IP کلادفلر و اتصال...';
                  
                  Future.delayed(const Duration(seconds: 2), () {
                    setState(() {
                      isConnecting = false;
                      isConnected = true;
                      connectionStatus = 'متصل به شبکه کلادفلر';
                    });
                  });
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF111827),
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(6),
                        decoration: BoxDecoration(
                          color: const Color(0xFFF38020).withOpacity(0.2),
                          borderRadius: BorderRadius.circular(8),
                        ),
                        child: const Icon(Icons.cloud_queue, color: Color(0xFFF38020), size: 24),
                      ),
                      const SizedBox(width: 12),
                      const Text(
                        'MG Net',
                        style: TextStyle(
                          fontWeight: FontWeight.bold,
                          letterSpacing: 1.2,
                          color: Colors.white,
                        ),
                      ),
                      const SizedBox(width: 8),
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                        decoration: BoxDecoration(
                          color: const Color(0xFFF38020),
                          borderRadius: BorderRadius.circular(4),
                        ),
                        child: const Text(
                          'CF',
                          style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: Colors.black),
                        ),
                      )
                    ],
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.center,
                    children: [
                      // Cloudflare Status Card
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: const Color(0xFF111827),
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(
                            color: isConnected 
                                ? const Color(0xFF00E676) 
                                : const Color(0xFFF38020).withOpacity(0.3),
                          ),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('سرویس اتصال کلادفلر', style: TextStyle(color: Colors.grey, fontSize: 12)),
                                const SizedBox(height: 4),
                                Text(
                                  connectionStatus,
                                  style: TextStyle(
                                    color: isConnected ? const Color(0xFF00E676) : const Color(0xFFF38020),
                                    fontWeight: FontWeight.bold,
                                    fontSize: 15,
                                  ),
                                ),
                              ],
                            ),
                            if (isConnected)
                              Row(
                                children: [
                                  const Icon(Icons.speed, color: Colors.grey, size: 16),
                                  const SizedBox(width: 4),
                                  Text('$ping ms', style: const TextStyle(color: Color(0xFF00E676), fontSize: 12)),
                                ],
                              )
                          ],
                        ),
                      ),
                      const SizedBox(height: 35),

                      // Connect Button
                      GestureDetector(
                        onTap: isConnecting ? null : _toggleConnection,
                        child: Container(
                          width: 170,
                          height: 170,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            gradient: LinearGradient(
                              colors: isConnected
                                  ? [const Color(0xFF00E676), const Color(0xFF00C853)]
                                  : [const Color(0xFFF38020), const Color(0xFFE65100)],
                              begin: Alignment.topLeft,
                              end: Alignment.bottomRight,
                            ),
                            boxShadow: [
                              BoxShadow(
                                color: (isConnected ? const Color(0xFF00E676) : const Color(0xFFF38020)).withOpacity(0.4),
                                blurRadius: 25,
                                spreadRadius: 4,
                              ),
                            ],
                          ),
                          child: Center(
                            child: isConnecting
                                ? const CircularProgressIndicator(color: Colors.white)
                                : Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Icon(
                                        isConnected ? Icons.shield : Icons.power_settings_new,
                                        size: 60,
                                        color: Colors.white,
                                      ),
                                      const SizedBox(height: 8),
                                      Text(
                                        isConnected ? 'متصل شد' : 'اتصال کلادفلر',
                                        style: const TextStyle(
                                          color: Colors.white,
                                          fontWeight: FontWeight.bold,
                                          fontSize: 15,
                                        ),
                                      ),
                                    ],
                                  ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 40),

                      // Worker Config Field
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: const Color(0xFF111827),
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('آدرس اختصاصی Cloudflare Worker', style: TextStyle(color: Colors.grey, fontSize: 12)),
                            const SizedBox(height: 8),
                            TextField(
                              controller: _workerController,
                              style: const TextStyle(color: Color(0xFFF38020), fontSize: 12),
                              decoration: InputDecoration(
                                filled: true,
                                fillColor: const Color(0xFF090D16),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(12),
                                  borderSide: BorderSide.none,
                                ),
                                suffixIcon: IconButton(
                                  icon: const Icon(Icons.sync, color: Color(0xFFF38020)),
                                  onPressed: () {
                                    ScaffoldMessenger.of(context).showSnackBar(
                                      const SnackBar(content: Text('کانفیگ اختصاصی کلادفلر به‌روزرسانی شد!')),
                                    );
                                  },
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: |
          cd mg_net_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-Net-Cloudflare-Edition
          path: mg_net_app/build/app/outputs/flutter-apk/app-release.apk
