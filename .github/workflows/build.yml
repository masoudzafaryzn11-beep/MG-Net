name: Build MG APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Base App
        run: |
          rm -rf mg_app
          flutter create mg_app --org com.mg.vpn --project-name mg

      - name: Write Main Code
        run: |
          echo "import 'package:flutter/material.dart';" > mg_app/lib/main.dart
          echo "void main() => runApp(const MaterialApp(home: Scaffold(backgroundColor: Color(0xFF070B12), body: Center(child: Text('MG VPN', style: TextStyle(color: Color(0xFF00E5FF), fontSize: 32, fontWeight: FontWeight.bold))))));" >> mg_app/lib/main.dart

      - name: Build APK
        run: |
          cd mg_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-App
          path: mg_app/build/app/outputs/flutter-apk/app-release.apk
